name: PR Verification

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate NuGet
        run: |
          dotnet nuget update source HomeBudgetManager \
            --username $GITHUB_ACTOR \
            --password $NUGET_AUTH_TOKEN \
            --store-password-in-clear-text \
            --configfile NuGet.Config
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: dotnet restore Bff.WebUI.slnx

      - name: Build
        run: dotnet build Bff.WebUI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Bff.WebUI.slnx --configuration Release --no-build --verbosity normal
