name: Main-CD-API

on:
  push:
    branches:
      - main

concurrency:
  group: main-cd-api
  cancel-in-progress: true
  
jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^version:' .github/workflows/version | cut -d':' -f2- | xargs)
          if [ -z "$VERSION" ]; then
            echo "version is empty in .github/workflows/version"
            exit 1
          fi
          RUN_DATE=$(date -u "+%Y%m%d%H%M%S")
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          file: ./Api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            NUGET_USERNAME=HomeBudgetManager
          secret-envs: |
            nuget_pat=NUGET_PAT
